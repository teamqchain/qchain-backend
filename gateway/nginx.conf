# =============================================================================
# QCHAIN GATEWAY — NGINX CONFIG
# =============================================================================
#
# The single public entry point of the QChain API. Tailscale Funnel forwards
# the public HTTPS address (https://<vm>.<tailnet>.ts.net) to this server on
# port 8090, and this server routes by URL path:
#
#     /api/       → the Go backend API   (forwarded to localhost:3000)
#     /gw-health  → "ok", the gateway's own health check
#     /           → 302 redirect to QPortal on Vercel
#
# QPortal (the web portal) is hosted on Vercel and calls this API across
# origins; the backend's CORS headers allow that. QWallet (mobile) calls the
# same /api/ address. The redirect keeps every old portal link working.
#
# Why port 8090 (not 80 or 8080)? Port 8080 is used by the IPFS gateway on the
# VM, and 80 may be taken. Tailscale Funnel maps the public 443 to 8090.
# =============================================================================

server {
    # The container runs with --network host, so this binds the VM's port 8090.
    listen 8090;
    server_name _;

    # Compress API responses.
    gzip on;
    gzip_types application/json text/plain;

    # -------------------------------------------------------------------------
    # Gateway health check (exact match): proves the gateway itself is up,
    # without depending on the backend.
    # -------------------------------------------------------------------------
    location = /gw-health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # -------------------------------------------------------------------------
    # /api/  →  Go backend on localhost:3000
    # -------------------------------------------------------------------------
    # "^~" means: once a request starts with /api/, use THIS block. The trailing
    # slash on proxy_pass strips the "/api" prefix, so:
    #     /api/health            → backend /health
    #     /api/mobile/getCatalog → backend /mobile/getCatalog
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Everything else  →  QPortal on Vercel (same path, so deep links survive)
    # -------------------------------------------------------------------------
    # 302 (temporary), not 301: browsers would cache a 301 for good, and the
    # portal's address may still change.
    location / {
        return 302 https://qchain-portal.vercel.app$request_uri;
    }

    # Basic hardening.
    add_header X-Content-Type-Options "nosniff" always;
}
