# Auto-deploy the gateway (Nginx in front of the API) when gateway/ changes on main.
#
# Runs on the self-hosted runner on the VM (label: qchain-vm), from the VM's
# own checkout, same as deploy-backend.yml. QPortal is no longer built here: it
# is hosted on Vercel, and the gateway's root (/) redirects to it.
#
# Flow: pull main → build → restart → /gw-health + the / redirect.
# If the new container is unhealthy, the previous image is restarted and the
# run is marked failed. /api/ is deliberately not checked, so a backend outage
# can't roll back a good gateway.

name: Deploy gateway

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "!gateway/**/*.md"
      - ".github/workflows/deploy-gateway.yml"
  workflow_dispatch:

# Separate from the backend's group, so a queued backend deploy never
# replaces a queued gateway deploy (or the other way round).
concurrency:
  group: deploy-gateway
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: [self-hosted, qchain-vm]
    timeout-minutes: 30
    steps:
      - name: Sync the VM checkout to main
        run: |
          REPO_ROOT="$HOME/Desktop/QChain/teamqchain/qchain-backend"
          echo "REPO_ROOT=$REPO_ROOT" >> "$GITHUB_ENV"
          cd "$REPO_ROOT"
          BRANCH="$(git branch --show-current)"
          if [[ "$BRANCH" != "main" ]]; then
            echo "::error::VM checkout is on '$BRANCH', not main"
            exit 1
          fi
          # Deploy exactly main: refuse if tracked files were edited by hand.
          if ! git diff --quiet HEAD; then
            echo "::error::VM checkout has uncommitted changes to tracked files. Commit or discard them, then re-run."
            git status --short --untracked-files=no
            exit 1
          fi
          git pull --ff-only origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::error::$GITHUB_SHA is not in the pulled main"
            exit 1
          fi
          echo "Deploying: $(git log -1 --oneline)"

      - name: Keep the running image as the rollback point
        run: |
          if docker image inspect qchain-web-gateway:latest >/dev/null 2>&1; then
            docker tag qchain-web-gateway:latest qchain-web-gateway:previous
            echo "Rollback point saved as qchain-web-gateway:previous"
          else
            echo "No qchain-web-gateway:latest yet (first deploy), nothing to roll back to"
          fi

      # A failed build stops here; the old container keeps running.
      - name: Build image
        run: cd "$REPO_ROOT" && bash gateway/docker-build.sh

      - name: Restart container
        id: deploy
        run: cd "$REPO_ROOT" && bash gateway/docker-run.sh

      - name: Health check
        id: health
        run: |
          for _ in $(seq 1 30); do
            if [[ "$(curl -sf -m 5 http://localhost:8090/gw-health || true)" == "ok" ]] \
               && [[ "$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://localhost:8090/ || true)" == "302" ]]; then
              echo "qchain-web-gateway is healthy and redirects / to QPortal"
              exit 0
            fi
            sleep 2
          done
          echo "::error::qchain-web-gateway did not become healthy within 60s"
          docker logs --tail 100 qchain-web-gateway || true
          exit 1

      # Only when the old container was actually replaced (deploy or health
      # failed). The job stays failed either way, so the pusher is emailed.
      - name: Roll back to the previous image
        if: failure() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          if ! docker image inspect qchain-web-gateway:previous >/dev/null 2>&1; then
            echo "::error::No qchain-web-gateway:previous image, cannot roll back"
            exit 1
          fi
          docker tag qchain-web-gateway:previous qchain-web-gateway:latest
          cd "$REPO_ROOT" && bash gateway/docker-run.sh
          for _ in $(seq 1 30); do
            if [[ "$(curl -sf -m 5 http://localhost:8090/gw-health || true)" == "ok" ]]; then
              echo "::error::Deploy of ${GITHUB_SHA::7} failed. Rolled back to the previous image, which is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Rollback image is not healthy either. qchain-web-gateway needs manual attention."
          docker logs --tail 100 qchain-web-gateway || true
          exit 1

      # Dangling (untagged, unused) images only; latest + previous are kept.
      - name: Remove dangling images
        run: docker image prune -f
